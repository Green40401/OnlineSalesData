<script>

const SHEET='1LMZGZwQfy-7vZACamAflfhMGkJSHerOoSV5RHDNCCTA';

// ===========================================================

const num=v=>parseFloat(String(v||'').replace(/[₹,\s]/g,''))||0;
const inr=v=>{const a=Math.abs(v);return(v<0?'-':'')+'₹'+(a>=1e7?(a/1e7).toFixed(2)+' Cr':a>=1e5?(a/1e5).toFixed(1)+' L':Math.round(a).toLocaleString('en-IN'))};
const nf=v=>Math.round(v).toLocaleString('en-IN');

const sd=(k,g)=>new Date(k+(g=='M'?'-01':'')+'T00:00');
const lab=(k,g)=>g=='M'?sd(k,g).toLocaleDateString('en-IN',{month:'short',year:'2-digit'}):(g=='W'?'Wk ':'')+sd(k,g).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function pd(v){v=(v||'').trim();if(!v)return null;let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1])}

if(/^\d{5}$/.test(v))return new Date(1899,11,30+ +v);const x=new Date(v);return isNaN(x)?null:new Date(x.getFullYear(),x.getMonth(),x.getDate())}
function csv(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R}
// ---- state
let RAW={},ROWS=[],MAX=new Date(),MIN=new Date(),isDemo=false,errs=[],synced='',MAP={};
try{MAP=JSON.parse(localStorage.getItem('ngmap')||'{}')}catch(e){}
const S={g:'D',from:null,to:null,ch:new Set(Object.keys(PL)),cat:'',comb:1,ct:'bar',m:'s',v:'ov'};
// ---- column detection
const GU={d:[/^date$/i,/date/i,/day/i],s:[/gmv/i,/net.*(sales|revenue)/i,/sales|revenue/i,/amount|value|mrp/i],u:[/qty|quantity|units/i,/sold|orders/i],c:[/^category$/i,/category|l1|department/i]};
const FN={d:'Date',s:'Sales (₹)',u:'Units',c:'Category'};
const tbl=p=>{const R=RAW[p],i=Math.max(0,R.findIndex(r=>r.filter(x=>x.trim()).length>=3));return{h:(R[i]||[]).map(x=>x.trim()),b:R.slice(i+1)}};
function gm(p){const{h}=tbl(p),m={...(MAP[p]||{})};for(const k in GU)if(m[k]==null||(m[k]&&!h.includes(m[k]))){m[k]=GU[k].map(re=>h.find(x=>re.test(x))).find(Boolean)||''}return m}
function mk(){ROWS=[];for(const p in RAW){const{h,b}=tbl(p),m=gm(p),ix=k=>m[k]?h.indexOf(m[k]):-1,di=ix('d'),si=ix('s'),ui=ix('u'),ci=ix('c');if(di<0||si<0){errs.push(p+': could not find a Date or Sales column')}else for(const r of b){const d=pd(r[di]);if(!d)continue;ROWS.push({d,k:ymd(d),p,c:ci>=0?(r[ci]||'').trim()||'Uncategorised':'All',s:num(r[si]),u:ui>=0?num(r[ui]):0})}}
if(!ROWS.length){isDemo=true;ROWS=demo()}range()}
function demo(){let z=7;const r=()=>(z=z*16807%2147483647)/2147483647,C=['Live Plants','Pots & Planters','Soil & Fertilisers','Garden Tools','Seeds'],B={Blinkit:1,BigBasket:.55,Zepto:.8,Instamart:.7},o=[],e=add(new Date(),-1);for(let i=149;i>=0;i--){const d=add(e,-i),w=[0,6].includes(d.getDay())?1.25:1;for(const p in B)C.forEach((c,j)=>{const u=Math.round((30-j*4)*B[p]*w*(1+(149-i)/400)*(.7+r()*.6));o.push({d,k:ymd(d),p,c,u,s:u*(180+j*40+Math.round(r()*30))})})}return o}
function range(){let a=ROWS[0].d,b=a;ROWS.forEach(r=>{if(r.d<a)a=r.d;if(r.d>b)b=r.d});MIN=a;MAX=b;S.to=b;S.from=a>add(b,-29)?a:add(b,-29)}
// ---- load
async function boot(){$('#ct').innerHTML='<div class="sk"></div><div class="sk" style="height:200px"></div><div class="sk"></div>';errs=[];RAW={};isDemo=false;
await Promise.all(Object.keys(PL).map(async p=>{try{const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(PL[p].tab)}`,{cache:'no-store'});const t=await res.text();if(!res.ok||/^\s*</.test(t))throw Error('sheet is private or tab not found');RAW[p]=csv(t)}catch(e){errs.push(p+': '+(e.message||'could not load'))}}));
mk();synced=new Date().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});R()}
// ---- aggregation
const val=r=>S.m=='u'?r.u:r.s,fv=v=>S.m=='u'?nf(v):inr(v);
const inR=(r,a,b)=>r.k>=a&&r.k<=b&&S.ch.has(r.p)&&(!S.cat||r.c==S.cat);
const sum=(rows,f=r=>r.s)=>rows.reduce((a,r)=>a+f(r),0);
function by(rows,f,v=r=>r.s){const m=new Map();rows.forEach(r=>m.set(f(r),(m.get(f(r))||0)+v(r)));return m}
const gr=(a,b)=>b>0?(a/b-1)*100:null,dl=g=>g==null?'':`<span class="d ${g>=0?'up':'dn'}">${g>=0?'▲':'▼'} ${Math.abs(g).toFixed(1)}%</span>`;
const part=(k,g)=>{const s=sd(k,g),e=g=='M'?new Date(s.getFullYear(),s.getMonth()+1,0):g=='W'?add(s,6):s;return e>MAX};
function ctx(){const a=ymd(S.from),b=ymd(S.to),len=Math.round((S.to-S.from)/864e5)+1,rows=ROWS.filter(r=>inR(r,a,b)),prev=ROWS.filter(r=>inR(r,ymd(add(S.from,-len)),ymd(add(S.from,-1))));
const bk=[];for(let d=new Date(S.from);d<=S.to;d=add(d,1)){const k=key(d,S.g);if(bk[bk.length-1]!=k)bk.push(k)}
const ix=Object.fromEntries(bk.map((k,i)=>[k,i])),sr={};rows.forEach(r=>{const i=ix[key(r.d,S.g)];if(i!=null)(sr[r.p]??=Array(bk.length).fill(0))[i]+=val(r)});
const tot=bk.map((_,i)=>Object.values(sr).reduce((x,v)=>x+v[i],0));return{rows,prev,len,bk,sr,tot}}
// ---- charts
function chart(bk,ss,type){const W=720,H=250,L=56,B=28,T=10,n=bk.length||1,tot=bk.map((_,i)=>ss.reduce((a,s)=>a+s.v[i],0)),mx=Math.max(1,...(type=='bar'?tot:ss.flatMap(s=>s.v))),y=v=>T+(H-T-B)*(1-v/mx),w=(W-L-6)/n,x=i=>L+w*i+w/2;
let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">`;for(let i=0;i<=4;i++){const v=mx*i/4;o+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fv(v)}</text>`}
if(type=='bar')bk.forEach((k,i)=>{let a=0;ss.forEach(s=>{const h=(H-T-B)*s.v[i]/mx;o+=`<rect x="${x(i)-w*.4}" y="${y(a+s.v[i])}" width="${w*.8}" height="${Math.max(h,0)}" fill="${s.c}"><title>${lab(k,S.g)} · ${esc(s.n)}: ${fv(s.v[i])}</title></rect>`;a+=s.v[i]})});
else ss.forEach(s=>{o+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.2" points="${s.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;if(n<=45)o+=s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.c}"><title>${lab(bk[i],S.g)} · ${esc(s.n)}: ${fv(v)}</title></circle>`).join('')});
const st=Math.ceil(n/8);bk.forEach((k,i)=>{if(i%st==0)o+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${lab(k,S.g)}</text>`});return o+'</svg>'}
function donut(l,v,c){const t=sum(v,x=>x)||1;let o=0;return`<svg viewBox="0 0 400 170"><g transform="translate(90,85) rotate(-90)">${v.map((x,i)=>{const d=x/t*251.3,s=`<circle r="40" fill="none" stroke="${c[i]}" stroke-width="22" stroke-dasharray="${d} 251.3" stroke-dashoffset="${-o}"><title>${esc(l[i])}: ${(x/t*100).toFixed(1)}%</title></circle>`;o+=d;return s}).join('')}</g>${l.map((n,i)=>`<rect x="200" y="${20+i*22}" width="10" height="10" rx="2" fill="${c[i]}"/><text x="216" y="${29+i*22}" style="font-size:12px">${esc(n)} · ${(v[i]/t*100).toFixed(0)}%</text>`).join('')}</svg>`}
const hbars=(rows,c='var(--ac)')=>{const m=Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="hb"><span title="${esc(r[0])}">${esc(r[0])}</span><div class="pb"><i style="width:${r[1]/m*100}%;background:${c}"></i></div><span>${fv(r[1])}</span></div>`).join('')};
const table=(h,rows,nc=[])=>`<div class="tw"><table><tr>${h.map((x,i)=>`<th class="${nc.includes(i)?'n':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${nc.includes(i)?'n':''}">${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
// ---- insights
function insights(c){const o=[],{rows,prev,bk,tot}=c,gn={D:'day',W:'week',M:'month'}[S.g],T=sum(rows),P=sum(prev),g=gr(T,P);
if(g!=null)o.push([g>=0?'g':'r','Period vs previous',`Sales are ${g>=0?'up':'down'} ${Math.abs(g).toFixed(1)}% (${inr(T)} vs ${inr(P)}) compared with the previous ${c.len} days.`]);
let n=bk.length-1;if(n>=0&&part(bk[n],S.g)&&S.g!='D')n--;if(n>=1&&tot[n-1]>0){const x=gr(tot[n],tot[n-1]);o.push([x>=0?'g':'r',`Latest ${gn} trend`,`${lab(bk[n],S.g)} closed at ${fv(tot[n])}, ${x>=0?'up':'down'} ${Math.abs(x).toFixed(1)}% on the ${gn} before.${S.g!='D'&&n<bk.length-1?' The latest '+gn+' is still in progress and left out.':''}`])}
if(bk.length>2){const mi=tot.indexOf(Math.max(...tot));o.push(['','Best '+gn,`${lab(bk[mi],S.g)} was the strongest ${gn} at ${fv(tot[mi])}.`])}
const ch=by(rows,r=>r.p),chp=by(prev,r=>r.p),cat=by(rows,r=>r.c),catp=by(prev,r=>r.c);
if(ch.size>1){const t=[...ch].sort((a,b)=>b[1]-a[1])[0];o.push(['','Channel mix',`${t[0]} drives ${(t[1]/(T||1)*100).toFixed(0)}% of sales in this view.`]);
const mv=[...ch].map(([k,v])=>[k,gr(v,chp.get(k)||0)]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1]);if(mv.length>1&&mv[0][1]<0)o.push(['r','Channel to watch',`${mv[0][0]} fell ${Math.abs(mv[0][1]).toFixed(1)}% vs the previous period.`]);if(mv.length>1)o.push(['g','Fastest-growing channel',`${mv[mv.length-1][0]} moved ${mv[mv.length-1][1]>=0?'up':'down'} ${Math.abs(mv[mv.length-1][1]).toFixed(1)}%.`])}
if(cat.size>1){const t=[...cat].sort((a,b)=>b[1]-a[1])[0],sh=t[1]/(T||1)*100;o.push([sh>50?'r':'',sh>50?'Category concentration':'Top category',`${t[0]} contributes ${sh.toFixed(0)}% of sales${sh>50?', so results depend heavily on it':''}.`]);
const mv=[...cat].filter(([k])=>(catp.get(k)||0)>0).map(([k,v])=>[k,gr(v,catp.get(k))]).sort((a,b)=>b[1]-a[1]);if(mv.length>1&&mv[0][1]>0)o.push(['g','Category momentum',`${mv[0][0]} grew ${mv[0][1].toFixed(1)}% vs the previous period.`])}
const wd=Array(7).fill(0),wc=Array(7).fill(0);new Set(rows.map(r=>r.k)).forEach(k=>wc[new Date(k+'T00:00').getDay()]++);rows.forEach(r=>wd[r.d.getDay()]+=r.s);const av=wd.map((v,i)=>wc[i]?v/wc[i]:0);if(wc.filter(x=>x>1).length>=5){const i=av.indexOf(Math.max(...av));o.push(['','Weekday pattern',`${['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'][i]} sell best, averaging ${inr(av[i])} a day.`])}
return o.slice(0,8)}
// ---- views
function kpis(c){const{rows,prev,len}=c,T=sum(rows),P=sum(prev),U=sum(rows,r=>r.u),PU=sum(prev,r=>r.u),ch=[...by(rows,r=>r.p)].sort((a,b)=>b[1]-a[1])[0],ca=[...by(rows,r=>r.c)].sort((a,b)=>b[1]-a[1])[0];
const k=(l,v,d='')=>`<div class="card"><div class="kl">${l}</div><div class="kv">${v}</div>${d||'<span class="d">&nbsp;</span>'}</div>`,pv=' <span class="kl">vs prev period</span>';
return`<div class="grid k">${k('Total sales',inr(T),dl(gr(T,P))+pv)}${U?k('Units sold',nf(U),dl(gr(U,PU))+pv):''}${k('Avg sales per day',inr(T/len),dl(gr(T/len,P/len))+pv)}${U?k('Avg selling price',inr(T/U)):''}${k('Top channel',ch?esc(ch[0]):'–',ch?`<span class="d kl">${inr(ch[1])} · ${(ch[1]/(T||1)*100).toFixed(0)}%</span>`:'')}${ca&&ca[0]!='All'?k('Top category',esc(ca[0]),`<span class="d kl">${inr(ca[1])} · ${(ca[1]/(T||1)*100).toFixed(0)}%</span>`):''}</div>`}
function trendCard(c){const ss=S.comb?[{n:'All channels',c:'#2563eb',v:c.tot}]:Object.keys(c.sr).map(p=>({n:p,c:PL[p].c,v:c.sr[p]})),gn={D:'Daily',W:'Weekly',M:'Monthly'}[S.g];
const lg=S.comb?'':ss.map(s=>`<span class="lg"><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('');
const prev=c.bk.map((k,i)=>{const t=c.tot[i],p=i?c.tot[i-1]:0,g=p>0?gr(t,p):null;return[lab(k,S.g)+(part(k,S.g)&&S.g!='D'?' *':''),fv(t),g==null?'–':dl(g)]}).reverse().slice(0,90);
return`<div class="card"><div class="ct">${gn} ${S.m=='u'?'units':'sales'}${lg}</div>${chart(c.bk,ss,S.ct)}</div><div class="h2">${gn} breakdown ${S.g!='D'?'<span class="kl" style="font-weight:400;font-size:12px">· * = period still in progress</span>':''}</div>${table(['Period',S.m=='u'?'Units':'Sales',{D:'vs previous day',W:'Week on week',M:'Month on month'}[S.g]],prev,[1,2])}`}
function chRows(c){const a=by(c.rows,r=>r.p),b=by(c.prev,r=>r.p),u=by(c.rows,r=>r.p,r=>r.u),T=sum(c.rows);return[...a].sort((x,y)=>y[1]-x[1]).map(([k,v])=>[`<b style="color:${PL[k]?.c==='#f8cb46'?'#b8860b':PL[k]?.c}">●</b> ${esc(k)}`,inr(v),(v/(T||1)*100).toFixed(1)+'%',nf(u.get(k)||0),inr(v/c.len),dl(gr(v,b.get(k)||0))||'–'])}
function view(){const c=ctx();let h='';
if(isDemo||errs.length)h+=`<div class="note">${isDemo?'<b>Showing demo data.</b> ':''}${errs.length?'Could not read: '+errs.map(esc).join('; ')+'. ':''}Check that the sheet is shared as <code>Anyone with the link → Viewer</code> and that tab names match, or use <b>Map columns</b> above.</div>`;
if(!c.rows.length)return h+'<div class="card">No rows match these filters. Widen the date range or clear the category filter.</div>';
if(S.v=='ov'){const ins=insights(c),cr=[...by(c.rows,r=>r.c)].sort((a,b)=>b[1]-a[1]).slice(0,8),cp=[...by(c.rows,r=>r.p)];
h+=kpis(c)+`<div class="h2">Insights</div><div class="ins">${ins.map(i=>`<div class="card ${i[0]}"><b>${i[1]}</b>${esc(i[2])}</div>`).join('')||'<div class="card">Not enough data for insights.</div>'}</div><div class="h2">Trend</div>${trendCard(c)}<div class="grid cg" style="margin-top:14px"><div class="card"><div class="ct">Channel contribution</div>${donut(cp.map(x=>x[0]),cp.map(x=>x[1]),cp.map(x=>PL[x[0]].c))}</div><div class="card"><div class="ct">Top categories</div>${hbars(cr)}</div></div>`}
else if(S.v=='ch'){h+=kpis(c)+`<div class="h2">Channel comparison</div>`+table(['Channel','Sales','Share','Units','Avg / day','vs prev period'],chRows(c),[1,2,3,4,5])+`<div class="h2">Trend by channel</div>`+trendCard({...c,});}
else{const cat=[...by(c.rows,r=>r.c)].sort((a,b)=>b[1]-a[1]),cp=by(c.prev,r=>r.c),T=sum(c.rows),pl=[...S.ch].filter(p=>c.sr[p]),pm=Object.fromEntries(pl.map(p=>[p,by(c.rows.filter(r=>r.p==p),r=>r.c)]));
h+=kpis(c)+`<div class="h2">Category performance</div><div class="grid cg"><div class="card"><div class="ct">Sales by category</div>${hbars(cat.slice(0,10))}</div><div class="card"><div class="ct">Category share</div>${donut(cat.slice(0,6).map(x=>x[0]),cat.slice(0,6).map(x=>x[1]),['#2563eb','#0d9488','#f59e0b','#8b5cf6','#ef4444','#16a34a'])}</div></div><div class="h2">Category × channel</div>`+table(['Category','Total','Share','vs prev',...pl],cat.map(([k,v])=>[esc(k),inr(v),(v/(T||1)*100).toFixed(1)+'%',dl(gr(v,cp.get(k)||0))||'–',...pl.map(p=>inr(pm[p].get(k)||0))]),[1,2,3,...pl.map((_,i)=>i+4)])}
return h}

const NAVI=[['ov','Sales overview','▦','#3b82f6'],['ch','By channel','⇄','#8b5cf6'],['ca','By category','≣','#0d9488'],['su','Data setup','⚙','#64748b']];

$('#ct').innerHTML=view()}
const tp=p=>{S.ch.has(p)?S.ch.size>1&&S.ch.delete(p):S.ch.add(p);R()};
const pr=n=>{n=+n;S.to=MAX;S.from=n?(add(MAX,-(n-1))<MIN?MIN:add(MAX,-(n-1))):MIN;R()};

function setup(){return`<div class="grid cg">${Object.entries(PL).map(([p,x])=>{const ok=RAW[p],n=ROWS.filter(r=>r.p==p&&!isDemo).length,m=ok?gm(p):{};return`<div class="card"><div class="ct"><span class="ic" style="background:${x.c};color:${x.t};display:inline-grid">${x.s}</span>${p}</div><div class="kl">Tab: ${esc(x.tab)}</div><div style="margin:8px 0">${ok?`<span class="live">Connected</span> ${nf(n)} rows`:'<span class="demo">Not connected</span>'}</div>${ok?Object.keys(FN).map(k=>`<div class="d">${FN[k]}: <b>${esc(m[k]||'not found')}</b></div>`).join(''):''}</div>`}).join('')}</div><div class="h2">How refresh works</div><div class="card">Every time this page opens (or you press Refresh) it reads the four tabs straight from Google Sheets, so whatever your daily update adds shows up automatically. Nothing is stored outside your sheet.<br><br>Sheet: <a href="https://docs.google.com/spreadsheets/d/${SHEET}" target="_blank" rel="noopener">open in Google Sheets</a></div>`}
